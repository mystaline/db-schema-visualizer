name = "schemaviz-mcp"
main = "dist/worker.js"

# Deliberately conservative/past — Cloudflare rejects a compatibility_date
# in the future relative to its own clock, and this file may be built or
# deployed long after it's written. Bump it if you want newer runtime
# behavior. Matches the convention already used in mail-worker.
compatibility_date = "2024-01-01"

# No nodejs_compat flag — verified locally (wrangler dev, including an
# actual ts_to_schema call exercising the bundled typescript compiler) that
# nothing here actually needs it. Matches mail-worker's convention.

# Uncomment and point at your own domain to serve this worker there instead
# of the default *.workers.dev subdomain — same [[routes]] + custom_domain
# shape mail-worker already uses for mail.mystaline.dev:
#
# [[routes]]
# pattern = "schemaviz-mcp.mystaline.dev"
# custom_domain = true
